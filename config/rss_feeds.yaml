# RSS Feed Configuration

feeds:
  techcrunch:
    name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
    priority: 1
    description: "Startup and technology"
    enabled: true

  theverge:
    name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
    priority: 1
    description: "Technology, science, art, and culture"
    enabled: false

  cnbc_economy:
    name: "CNBC Economy"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
    description: "Global macroeconomic indicators and economic"
    priority: 2
    enabled: true

  bloomberg:
    name: "Bloomberg"
    url: "https://feeds.bloomberg.com/markets/news.rss"
    fallback_url: "https://news.google.com/rss/search?q=site:bloomberg.com&hl=en-US&gl=US&ceid=US:en"
    description: "Global financial markets, business, analysis"
    priority: 1
    enabled: true