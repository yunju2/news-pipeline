[project]
name = "daily-tech-newsletter"
version = "1.0.0"
description = "데일리 테크·투자 뉴스레터 자동 생성 파이프라인"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.12",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "trafilatura>=2.0.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "numpy>=2.4.2",
    "groq>=1.1.0",
    "google-genai>=1.66.0",
    "openai>=2.26.0",
    "rich>=14.3.3",
    "boto3>=1.42.64",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]
