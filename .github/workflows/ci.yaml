name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run ruff format check
        run: ruff format . --check
      - name: Run ruff lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Pytest (if tests exist)
        shell: bash
        run: |
          if [ -d tests ] || find . -maxdepth 2 -name "test_*.py" | grep -q .; then
            pytest -q
          else
            echo "No tests found; skipping."
          fi
